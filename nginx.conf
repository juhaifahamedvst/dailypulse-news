# DailyPulse's front door (lesson 39.7): nginx hands each request to one of the API's containers.
resolver 127.0.0.11 valid=10s; # Docker's own DNS server, on every user-defined network

upstream news_api {
    zone news_api 64k;       # one shared list for every nginx worker (Chapter 36)
    server api:8000 resolve; # every container of the api service, looked up again as it changes
}

server {
    listen 80;

    location / {
        proxy_pass http://news_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
