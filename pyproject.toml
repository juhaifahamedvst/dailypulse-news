[project]
name = "dailypulse-news"
version = "1.2.0"
description = "DailyPulse's news API: the headlines for the phone app and the website."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "redis>=8.2.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.41.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# The team's rules, in the repository: every PC and the CI read the same ones (lesson 40.3)
[tool.ruff]
line-length = 100 # ruff's default is 88; the team's code is written for 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"] # Celery ships no type hints: trust it, check our own code strictly
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tasks"]
disallow_untyped_decorators = false # @app.task comes from Celery, which has no type hints
