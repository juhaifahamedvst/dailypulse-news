# DailyPulse's checks (lesson 40.4): the code, the commit messages and the shell scripts, on every pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # the workflow only reads the code

concurrency: # a new push to a pull request cancels the run that is still checking the old one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.14.10", "3.15"] # the image's Python, and the next one
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1
      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python }}
      - name: Install the packages from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Get the code, with its history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # every commit, so the script can see the pull request's own
      - name: Commit messages (Chapter 17's rule)
        run: sh scripts/check_commits.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - name: Shell scripts
        run: shellcheck scripts/*.sh
