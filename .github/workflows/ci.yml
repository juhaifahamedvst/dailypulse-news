# DailyPulse's first workflow (lesson 40.2): run the tests on every push to main and every pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
      - name: Install the packages from uv.lock
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest
