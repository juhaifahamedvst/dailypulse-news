# DailyPulse's pipeline (lessons 40.5 and 40.6): lint, test, build, start the stack, push the image from main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # every job reads the code; only the image job gets more

concurrency: # a new push to a pull request cancels the run that is still checking the old one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.14.10", "3.15"] # the image's Python, and the next one
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps
      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python }}
      - name: Install the packages from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Get the code, with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, so the script can see the pull request's own
          persist-credentials: false
      - name: Commit messages (Chapter 17's rule)
        run: sh scripts/check_commits.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Workflow files (actionlint and zizmor, pinned by digest)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.33.1@sha256:ecd3ffe6158de1322e05a044ed43749bee12b1dccb7e1a7859bc6ac4b2a1c516 \
            --offline .

  stack:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Practice settings and secrets (made here, thrown away with the runner)
        run: |
          cp .env.example .env
          cp news.env.example news.env
          mkdir -p secrets
          printf '%s' "ci-archive-password" > secrets/db_password.txt
          printf '%s' "ci-editor-key" > secrets/editor_key.txt
      - name: The Compose file
        run: docker compose config --quiet
      - name: The Dockerfile's build checks
        run: docker build --check .
      - name: The tests, inside the image's Python (the test stage)
        run: docker build --target test .
      - name: Start the stack and wait for every health check
        run: docker compose up -d --build --wait
      - name: Smoke test, through nginx
        run: |
          bash scripts/check_api.sh http://127.0.0.1:8039/healthz
          bash scripts/check_api.sh http://127.0.0.1:8039/v1/headlines
          curl --silent --fail http://127.0.0.1:8039/v1/headlines | grep -q '"id":9005'
      - name: What the containers said, if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and delete the practice stack
        if: always()
        run: docker compose down -v

  image:
    needs: [checks, stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io with this job's GITHUB_TOKEN
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub's container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names for the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
