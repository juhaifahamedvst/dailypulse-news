# DailyPulse's checks (lesson 40.3): the four commands of the PC, on the image's Python and on the next one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # the workflow only reads the code

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.14.10", "3.15"] # the image's Python, and the next one
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1
      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          python-version: ${{ matrix.python }}
      - name: Install the packages from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest
